[package]
name = "verity-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.5"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Blockchain interaction (Alloy)
alloy = { version = "0.6", features = ["full", "signer-mnemonic"] }
alloy-signer-local = "0.6"

# Database
surrealdb = { version = "2.0", features = ["protocol-http"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication & Security
siwe = "0.6"
jsonwebtoken = "9.3"
chrono = "0.4"
rand = "0.8"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
dotenv = "0.15"

# Config
config = "0.14"

[dev-dependencies]
tokio-test = "0.4"
